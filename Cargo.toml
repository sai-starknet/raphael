[package]
name = "raphael"
version = "0.1.0"
edition = "2021"

[dependencies]
camino = { version = "1", features = ["serde1"] }
scarb-metadata = "1.15.1"
semver = "1.0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol_str = { version = "0.2", features = ["serde"] }
starknet = "0.12"
starknet-crypto = "0.7"
starknet-types-core = "0.1"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
