# SAI Development Profile Configuration
# This file configures deployment settings for the 'dev' profile

[account]
# StarkNet RPC endpoint
rpc_url = "http://localhost:5050/"

# Your StarkNet account address
account_address = "0x2af9427c5a277474c079a1283c880ee8a6f0f8fbf73ce969c08d88befec1bba"

# Your account's private key
private_key = "0x1800000000300000180000000000030000000000003006001800006600"

# Alternative: Use keystore instead of private key
# keystore_path = "./keystore.json"  
# password = "your_keystore_password"

[provider.sepolia]
url = "https://sepolia.starknet.io/rpc"


[network]
# Optional network configuration
chain_id = "SN_SEPOLIA"
explorer_url = "https://sepolia.starkscan.co"

# Contract declaration configurations
# Maps tags to contract files for declaration
[declare]
[declare.my_contract]
# Contract name (optional, defaults to tag)
name = "my_contract"
from_chain = { provider = "sepolia", class_hash = "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef" }

# Custom file paths (optional, auto-generated if not specified)
# sierra_path = "./target/dev/my_tests_my_contract.contract_class.json"
# casm_path = "./target/dev/my_tests_my_contract.compiled_contract_class.json"

# Contract deployment configurations  
# Maps deployment tags to deployment settings
[deploy]
[deploy.my_contract_deployment]
# Reference to declared class by tag
class = "my_contract"
class_hash = "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"


# Alternative: use specific class hash instead of tag
# class_hash = "0x1234567890abcdef1234567890abcdef123456789"

# Deployment salt (optional, auto-generated if not provided)
salt = "0x0"

# Whether this is a unique deployment per deployer
unique = false

# Constructor arguments as hex strings
constructor_calldata = []

# Whether to wait for transaction acceptance (default: true)
wait_for_acceptance = true
